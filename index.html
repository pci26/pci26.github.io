<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCI Countdown</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

:root {
    --bg-image: url("sports and entertainment logo.ico");
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Instrument Serif", serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    color: white;
    background: black;
    position: relative;
}

/* Background */
body::before {
    content: "";
    position: fixed;
    inset: 0;

    background-image:
        linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,.75)),
        var(--bg-image);

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    filter: blur(10px);
    transform: scale(1.1);

    z-index: -1;
}

/* Opening Fade */
#fade-screen {
    position: fixed;
    inset: 0;
    background: black;
    z-index: 1000;
    opacity: 1;
    transition: opacity 1.5s ease;
}

#fade-screen.hide {
    opacity: 0;
    pointer-events: none;
}

#intro {
    position: absolute;
    z-index: 1001;
    font-size: 4rem;
    font-style: italic;
    opacity: 1;
    transition: opacity 1.5s ease, transform 1.5s ease;
}

#intro.fade-up {
    opacity: 0;
    transform: translateY(-150px);
}

#timer-container {
    text-align: center;
    opacity: 0;
    transition: opacity 1.5s ease;

    background: rgba(0,0,0,.3);
    backdrop-filter: blur(10px);

    padding: 30px;
    border-radius: 20px;
    min-width: 400px;
}

#timer-container.show {
    opacity: 1;
}

h1 {
    font-size: 2rem;
    margin-bottom: 20px;
}

#timer {
    font-size: 2.6rem;
    font-weight: bold;
}

#surpriseBtn {
    margin-top: 20px;
    padding: 12px 24px;
    background: white;
    color: black;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1rem;
    transition: .25s;
}

#surpriseBtn:hover {
    transform: scale(1.08);
}

/* Surprise Effects */

.particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 5000;
    animation: explode 2s ease-out forwards;
}

@keyframes explode {
    0% {
        opacity: 1;
        transform: translate(0,0) scale(1);
    }

    100% {
        opacity: 0;
        transform:
            translate(var(--x), var(--y))
            scale(0);
    }
}

.flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 9000;
}

.flash.active {
    animation: flash .4s;
}

@keyframes flash {
    0% { opacity:0; }
    25% { opacity:.8; }
    100% { opacity:0; }
}

.scratch-img {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 500px;
    max-width: 80vw;

    transform: translate(-50%, -50%);

    pointer-events: none;
    z-index: 7000;

    animation: scratchFade 2s forwards;
}

@keyframes scratchFade {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.5);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.3);
    }
}
</style>
</head>

<body>

<div id="fade-screen"></div>
<div class="flash" id="flash"></div>

<div id="intro">Are you ready?</div>

<div id="timer-container">
    <h1>Countdown to The Talk</h1>
    <div id="timer">Loading...</div>

    <button id="surpriseBtn">Surprise Me</button>
</div>

<script>
const intro = document.getElementById("intro");
const timerContainer = document.getElementById("timer-container");
const fadeScreen = document.getElementById("fade-screen");
const flash = document.getElementById("flash");

/* Intro Animation */
setTimeout(() => {

    intro.classList.add("fade-up");
    fadeScreen.classList.add("hide");

    setTimeout(() => {
        timerContainer.classList.add("show");
    }, 1000);

}, 3000);

/* Countdown */
const targetDate =
    new Date("September 11, 2026 09:00:00").getTime();

function updateTimer() {

    const now = new Date().getTime();
    const distance = targetDate - now;

    if(distance <= 0) {
        document.getElementById("timer")
            .textContent = "The Talk has begun!";
        return;
    }

    const days =
        Math.floor(distance / (1000*60*60*24));

    const hours =
        Math.floor(
            (distance %
            (1000*60*60*24))
            /(1000*60*60)
        );

    const minutes =
        Math.floor(
            (distance %
            (1000*60*60))
            /(1000*60)
        );

    const seconds =
        Math.floor(
            (distance %
            (1000*60))
            /1000
        );

    document.getElementById("timer").textContent =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

updateTimer();
setInterval(updateTimer, 1000);

/* Surprise Button */

const surpriseBtn =
    document.getElementById("surpriseBtn");

const effects = [
    confettiBurst,
    sparkleExplosion,
    rainbowStorm,
    tigerScratch
];

surpriseBtn.addEventListener("click", () => {

    const random =
        effects[Math.floor(
            Math.random() * effects.length
        )];

    random();
});

function makeParticle(color) {

    const p =
        document.createElement("div");

    p.className = "particle";

    const size =
        8 + Math.random() * 20;

    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.background = color;

    p.style.left = "50%";
    p.style.top = "50%";

    p.style.setProperty(
        "--x",
        (Math.random()*800-400)+"px"
    );

    p.style.setProperty(
        "--y",
        (Math.random()*800-400)+"px"
    );

    document.body.appendChild(p);

    setTimeout(() => p.remove(), 2000);
}

function confettiBurst() {

    const colors = [
        "#ff595e",
        "#ffca3a",
        "#8ac926",
        "#1982c4",
        "#6a4c93"
    ];

    for(let i=0;i<120;i++) {

        makeParticle(
            colors[
                Math.floor(
                    Math.random()
                    * colors.length
                )
            ]
        );
    }
}

function sparkleExplosion() {

    for(let i=0;i<100;i++) {
        makeParticle("white");
    }

    flash.classList.add("active");

    setTimeout(() => {
        flash.classList.remove("active");
    }, 400);
}

function rainbowStorm() {

    const colors = [
        "red",
        "orange",
        "yellow",
        "lime",
        "cyan",
        "blue",
        "violet"
    ];

    for(let i=0;i<200;i++) {

        makeParticle(
            colors[
                Math.floor(
                    Math.random()
                    * colors.length
                )
            ]
        );
    }
}

function tigerScratch() {

    const img =
        document.createElement("img");

    img.src =
    "https://raw.githubusercontent.com/pci26/pci26.github.io/main/399-3991075_claw-scratch-clipart-roblox-tiger-claw-design.png";

    img.className =
        "scratch-img";

    document.body.appendChild(img);

    flash.classList.add("active");

    setTimeout(() => {
        flash.classList.remove("active");
    }, 400);

    setTimeout(() => {
        img.remove();
    }, 2000);
}
</script>

</body>
</html>
